_schema-version: 3.3.0
ID: comparativomap
version: 1.8.2
description: "A simple CAP project."

modules:
  - name: comparativomap-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: comparativomap-auth
      - name: comparativomap-connectivity
      - name: comparativomap-destination

  - name: comparativomap-ui
    type: html5
    path: app/comparativemap
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      build-result: dist
      supported-platforms: []

  - name: comparativomap-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: comparativomap-html5-repo-host
        parameters:
          content-target: true
      - name: srv-api
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - comparativemapcomparativemap.zip
          name: comparativomap-ui
          target-path: resources/

  - name: comparativemap
    type: html5
    path: app/comparativemap
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  - name: comparativomap-destinations
    type: com.sap.application.content
    requires:
      - name: comparativomap-auth
        parameters:
          service-key:
            name: comparativomap-auth-key
      - name: comparativomap-html5-repo-host
        parameters:
          service-key:
            name: comparativomap-html5-repo-host-key
      - name: srv-api
      - name: comparativomap-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: comparativomap-html5-repository
              ServiceInstanceName: comparativomap-html5-repo-host
              ServiceKeyName: comparativomap-html5-repo-host-key
              sap.cloud.service: comparativomap.service
            - Name: comparativomap-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: comparativomap-auth
              ServiceKeyName: comparativomap-auth-key
              sap.cloud.service: comparativomap.service

resources:
  - name: comparativomap-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: "comparativomap-cvale-qas"
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  - name: comparativomap-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  - name: comparativomap-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                Name: comparativomap-srv
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
      service: destination
      service-plan: lite
    requires:
      - name: srv-api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv-api
          url: ~{srv-url}
          timeout: 180000

  - name: comparativomap-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - npx cds deploy
        - cp -r db.sqlite gen/srv
        - mkdir -p resources
