<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>C.Vale - Mapa Comparativo</title>
    <link rel="icon" href="https://www.cvale.com.br/site/web-files/imagens/logos/favicon.png" type="imagem/png" />
    <style>
      html,
      body,
      body > div,
      #container,
      #container-uiarea {
        height: 100%;
      }
    </style>
    <script
      id="sap-ui-bootstrap"
      src="https://sapui5.hana.ondemand.com/1.139.0/resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-resource-roots='{
            "comparativemap.comparativemap": "./"
        }'
      data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
      data-sap-ui-compat-version="edge"
      data-sap-ui-libs="sap.m,sap.ui.layout,sap.ui.mdc"
      data-sap-ui-async="true"
      data-sap-ui-frame-options="trusted"
     data-sap-ui-flexibilityServices='[
        {"connector": "KeyUserConnector", "url": "keyuser", "layers": ["CUSTOMER"]},
        {"connector": "PersonalizationConnector", "url": "keyuser", "layers": ["USER"]}
    ]'
    >
  </script>
  </head>
  <body class="sapUiBody sapUiSizeCompact" id="content">
    <div
      data-sap-ui-component
      data-name="comparativemap.comparativemap"
      data-id="container"
      data-settings='{"id" : "comparativemap.comparativemap"}'
      data-handle-validation="true"
    ></div>
  </body>
</html>
